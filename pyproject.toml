[project]
name = "chaficial"
version = "0.1.0"
description = "CHA-FICIAL (차피셜) AI - 한국형 중고차 시장 인텔리전스 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
