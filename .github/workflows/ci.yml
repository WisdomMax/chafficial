name: CHA-FICIAL CI

on:
  push:
    branches:
      - main
      - fix/*
      - feat/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies from Lockfile
        run: uv sync --frozen

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Pytest Suite
        run: uv run pytest -v
