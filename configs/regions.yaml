# 차피셜(CHA-FICIAL) 지역 설정 명세서
# 행정구역과 중고차 매매단지 권역의 엄격한 분리

defaults:
  market_analysis_scope: "NATIONWIDE"
  primary_sales_region_id: "REGION_JANGANPYEONG"
  customer_target_mode: "CAMPAIGN_SPECIFIED"

regions:
  - region_id: "REGION_NATIONWIDE"
    region_name: "전국"
    region_type: "COUNTRY"
    parent_region_id: null
    is_active: true

  # 광역 자치단체
  - region_id: "REGION_SEOUL"
    region_name: "서울특별시"
    region_type: "METROPOLIS"
    parent_region_id: "REGION_NATIONWIDE"
    is_active: true

  - region_id: "REGION_GYEONGGI"
    region_name: "경기도"
    region_type: "METROPOLIS"
    parent_region_id: "REGION_NATIONWIDE"
    is_active: true

  - region_id: "REGION_INCHEON_METRO"
    region_name: "인천광역시"
    region_type: "METROPOLIS"
    parent_region_id: "REGION_NATIONWIDE"
    is_active: true

  # -------------------------------------------------------------
  # 중고차 전문 매매단지 (MARKET_COMPLEX)
  # 일반 행정구역 문자열만으로 자동 확정되지 않으며 구체적 단지명이 필수
  # -------------------------------------------------------------
  - region_id: "REGION_JANGANPYEONG"
    region_name: "서울 장안평 중고차 시장"
    region_type: "MARKET_COMPLEX"
    parent_region_id: "REGION_SEOUL"
    is_active: true
    matched_complex_keywords:
      - "장안평 매매단지"
      - "장안평 자동차 매매단지"
      - "장한평 중고차"
      - "장안평 시장"
      - "장안평 자동차매매"
      - "용답동 자동차매매"
      - "장안모터프라자"

  - region_id: "REGION_SUWON"
    region_name: "경기 수원 자동차 매매단지"
    region_type: "MARKET_COMPLEX"
    parent_region_id: "REGION_GYEONGGI"
    is_active: true
    matched_complex_keywords:
      - "도이치오토월드"
      - "SK V1 모터스"
      - "SK V1"
      - "수원 중앙매매단지"
      - "수원 오토컬렉션"

  - region_id: "REGION_INCHEON"
    region_name: "인천 자동차 매매단지"
    region_type: "MARKET_COMPLEX"
    parent_region_id: "REGION_INCHEON_METRO"
    is_active: true
    matched_complex_keywords:
      - "인천 M파크"
      - "엠파크 허브"
      - "엠파크 타워"
      - "엠파크"
      - "가좌동 매매단지"

  - region_id: "REGION_BUCHEON"
    region_name: "경기 부천 자동차 매매단지"
    region_type: "MARKET_COMPLEX"
    parent_region_id: "REGION_GYEONGGI"
    is_active: true
    matched_complex_keywords:
      - "DY카랜드"
      - "부천 오토맥스"
      - "오토맥스"
      - "국민차차차 부천"
